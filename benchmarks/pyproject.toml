[project]
name = "metal-infer-benchmarks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub==1.32.0",
    "numpy==2.3.5",
    "transformers==5.12.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff>=0.15,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
